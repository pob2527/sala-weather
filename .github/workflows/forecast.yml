name: Publish Bangkok forecast
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3,9,15,21 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: sala-weather-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - run: python3 publish_forecast.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - uses: actions/deploy-pages@v4
