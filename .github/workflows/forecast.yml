name: Sala Live Bangkok Forecast
run-name: ${{ github.event.schedule == '17 0,6,12,18 * * *' && 'Check Bangkok forecast after the regular run' || 'Refresh Sala live Bangkok forecast' }}
on:
  workflow_dispatch:
  schedule:
    # 04:17, 10:17, 16:17, and 22:17 Bangkok time (UTC+7).
    - cron: '17 3,9,15,21 * * *'
    # Check once three hours after each regular slot. Publish only if that slot failed.
    - cron: '17 0,6,12,18 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: sala-weather-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: github-pages
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v6
      - uses: actions/cache/restore@v5
        with:
          path: .forecast-cache
          key: sala-met-forecast-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: sala-met-forecast-
      - run: python3 publish_forecast.py
        env:
          SALA_ENABLE_MET_NORWAY: 'true'
          SALA_RETRY_RUN: ${{ github.event.schedule == '17 0,6,12,18 * * *' }}
      - uses: actions/cache/save@v5
        if: always() && hashFiles('.forecast-cache/met-norway.json') != ''
        with:
          path: .forecast-cache
          key: sala-met-forecast-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-pages-artifact@v5
        if: hashFiles('public/weather.json') != ''
        with:
          path: public
      - uses: actions/deploy-pages@v5
        if: hashFiles('public/weather.json') != ''
